
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: college-event-portal
  template:
    metadata:
      labels:
        app: college-event-portal
    spec:
      containers:
        - name: event-portal
          image: mayur123987/college-event-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-portal-service
spec:
  type: NodePort
  selector:
    app: college-event-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
